<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Photography{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
</head>
<body class="bg-white text-neutral-900 antialiased">
  <header class="max-w-6xl mx-auto px-6 py-8">
    <a href="{{ url_for('gallery.index') }}" class="text-lg tracking-widest uppercase">Photography</a>
  </header>

  <main class="max-w-6xl mx-auto px-6 pb-16">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for category, message in messages %}
            <p class="text-sm {{ 'text-red-600' if category == 'error' else 'text-amber-600' if category == 'warning' else 'text-green-700' }}">
              {{ message }}
            </p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
