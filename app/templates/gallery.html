{% extends "base.html" %}

{% block title %}Photography{% endblock %}

{% block content %}
<nav class="mb-4 flex flex-wrap gap-x-5 gap-y-2 text-sm uppercase tracking-wide text-neutral-500">
  <a href="{{ url_for('gallery.index') }}"
     class="{{ 'text-neutral-900 font-medium' if not selected_category else 'hover:text-neutral-900' }}">
    All
  </a>
  {% for cat in categories %}
    <a href="{{ url_for('gallery.index', category=cat.slug) }}"
       class="{{ 'text-neutral-900 font-medium' if selected_category == cat.slug else 'hover:text-neutral-900' }}">
      {{ cat.name }}
    </a>
  {% endfor %}
</nav>

{% if all_keywords %}
  <form method="get" class="mb-8 flex items-center gap-2 text-sm">
    <label for="jump-keyword" class="text-neutral-500 uppercase tracking-wide">Jump to keyword</label>
    <select id="jump-keyword" name="tags" onchange="this.form.submit()" class="border border-neutral-300 px-2 py-1 normal-case">
      <option value="">Any category, any keyword…</option>
      {% for kw in all_keywords %}
        <option value="{{ kw.slug }}" {{ 'selected' if selected_tags|length == 1 and kw.slug in selected_tags and not selected_category else '' }}>{{ kw.name }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit" class="text-neutral-900 underline underline-offset-2">Go</button></noscript>
  </form>
{% endif %}

<div class="masonry-gallery" x-data='lightboxGallery({{ photos_for_lightbox | tojson }})'>
  {% for photo in photos %}
    <a href="{{ url_for('gallery.photo_detail', photo_id=photo.id) }}" @click.prevent="open({{ loop.index0 }})">
      <img
        src="{{ photo.thumbnail_url }}"
        alt="{{ photo.title or photo.original_filename }}"
        width="{{ photo.width }}"
        height="{{ photo.height }}"
        loading="lazy"
      >
    </a>
  {% else %}
    <p class="text-neutral-500">No photographs published yet.</p>
  {% endfor %}

  <div
    x-show="active !== null"
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/95"
    @keydown.window.escape="close()"
    @keydown.window.arrow-left="prev()"
    @keydown.window.arrow-right="next()"
    @touchstart="touchStart($event)"
    @touchend="touchEnd($event)"
  >
    <button @click="close()" class="absolute top-4 right-4 text-3xl leading-none text-white/80 hover:text-white" aria-label="Close">&times;</button>
    <button @click="prev()" class="absolute left-2 sm:left-4 text-4xl text-white/80 hover:text-white" aria-label="Previous photo">&#8249;</button>
    <template x-if="active !== null">
      <img :src="current().src" :alt="current().title" class="max-h-[90vh] max-w-[92vw] object-contain">
    </template>
    <button @click="next()" class="absolute right-2 sm:right-4 text-4xl text-white/80 hover:text-white" aria-label="Next photo">&#8250;</button>
  </div>
</div>
{% endblock %}
